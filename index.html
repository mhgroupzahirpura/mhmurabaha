<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Murabaha System</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Murabaha">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Theme color -->
  <meta name="theme-color" content="#081f3d">
  <meta name="robots" content="noindex, nofollow">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071426;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    /* ── SPLASH SCREEN ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at top, #0e2a52, #071426);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .logo-wrap {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      margin-bottom: 24px;
      border: 3px solid rgba(255,255,255,0.15);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-name {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .app-tagline {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 48px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 13px;
      color: #64748b;
    }

    /* ── IFRAME fills full screen ── */
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    /* ── INSTALL BANNER (shown before install) ── */
    #installBanner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: #0e2a52;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    #installBanner.show {
      transform: translateY(0);
    }

    #installBanner img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }

    .banner-text {
      flex: 1;
    }

    .banner-text strong {
      display: block;
      color: #fff;
      font-size: 14px;
    }

    .banner-text span {
      color: #94a3b8;
      font-size: 12px;
    }

    .install-btn {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .dismiss-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
    }

    .footer {
      position: fixed;
      bottom: 6px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: #1e293b;
      z-index: 50;
    }
  </style>
</head>
<body>

  <!-- Splash screen -->
  <div id="splash">
    <div class="logo-wrap">
      <img src="icon-192.png" alt="Murabaha Logo"
           onerror="this.src='https://lh3.googleusercontent.com/d/163JQ6TjViVAknY95wJWkImF-L8IGNeVj'">
    </div>
    <div class="app-name">Murabaha System</div>
    <div class="app-tagline">Finance Management</div>
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Opening app...</div>
  </div>

  <!-- App loads here (stays on github.io domain = PWA stays valid) -->
  <iframe
    id="appFrame"
    src="about:blank"
    allow="forms; scripts; same-origin; popups"
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation"
  ></iframe>

  <!-- Custom install banner -->
  <div id="installBanner">
    <img src="icon-192.png" alt="icon">
    <div class="banner-text">
      <strong>Install Murabaha System</strong>
      <span>Add to home screen for quick access</span>
    </div>
    <button class="install-btn" id="installBtn">Install</button>
    <button class="dismiss-btn" id="dismissBtn">✕</button>
  </div>

  <div class="footer">&copy; 2026 Murabaha System</div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbygHUKZUiXgXYVCXVXoQFFcaObH3KpSJHdYlT98KnJLWTUtL1PURdjgCtiwcXVwstqbKA/exec';

    // ── Service Worker ──
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW registered'))
        .catch(err => console.warn('SW error:', err));
    }

    // ── Load app in iframe ──
    window.addEventListener('load', () => {
      const frame = document.getElementById('appFrame');
      const splash = document.getElementById('splash');
      const loadingText = document.getElementById('loadingText');

      loadingText.textContent = 'Loading...';

      // Load GAS into iframe
      frame.src = GAS_URL;

      // Hide splash once iframe loads
      frame.addEventListener('load', () => {
        frame.style.display = 'block';
        splash.classList.add('hide');
        setTimeout(() => splash.style.display = 'none', 500);
      });

      // Fallback: hide splash after 5s even if iframe load event doesn't fire
      setTimeout(() => {
        frame.style.display = 'block';
        splash.classList.add('hide');
        setTimeout(() => splash.style.display = 'none', 500);
      }, 5000);
    });

    // ── PWA Install Prompt ──
    let deferredPrompt = null;
    const banner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');
    const dismissBtn = document.getElementById('dismissBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Show banner after a short delay so user sees the app first
      setTimeout(() => banner.classList.add('show'), 3000);
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      banner.classList.remove('show');
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('Install outcome:', outcome);
      deferredPrompt = null;
    });

    dismissBtn.addEventListener('click', () => {
      banner.classList.remove('show');
    });

    // Hide banner if already installed
    window.addEventListener('appinstalled', () => {
      banner.classList.remove('show');
      deferredPrompt = null;
    });
  </script>

</body>
</html>
