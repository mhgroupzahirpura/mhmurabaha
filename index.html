<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Murabaha System</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Murabaha">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Theme color for Android Chrome toolbar -->
  <meta name="theme-color" content="#081f3d">

  <!-- Prevent search engine indexing -->
  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #0e2a52, #071426);
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 0;
    }

    /* Logo */
    .logo-wrap {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      margin-bottom: 24px;
      border: 3px solid rgba(255,255,255,0.15);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* App name */
    .app-name {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .app-tagline {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 48px;
    }

    /* Spinner */
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 13px;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    /* Error state */
    .error-box {
      display: none;
      background: rgba(220,38,38,0.15);
      border: 1px solid rgba(220,38,38,0.3);
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
      max-width: 300px;
      margin-top: 20px;
    }

    .error-box p {
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .retry-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 20px;
      font-size: 11px;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="splash">

    <div class="logo-wrap">
      <img
        src="https://lh3.googleusercontent.com/d/163JQ6TjViVAknY95wJWkImF-L8IGNeVj"
        alt="Murabaha Logo"
        onerror="this.style.display='none'">
    </div>

    <div class="app-name">Murabaha System</div>
    <div class="app-tagline">Finance Management</div>

    <div class="spinner" id="spinner"></div>
    <div class="loading-text" id="loadingText">Opening app...</div>

    <div class="error-box" id="errorBox">
      <p>Could not connect. Please check your internet connection.</p>
      <button class="retry-btn" onclick="launchApp()">Retry</button>
    </div>

  </div>

  <div class="footer">&copy; 2026 Murabaha System</div>

  <script>
    // ============================================
    // ✅ REPLACE THIS WITH YOUR GAS WEB APP URL
    // ============================================
    const GAS_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID_HERE/exec';
    // ============================================

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW registered'))
        .catch(err => console.log('SW error:', err));
    }

    function launchApp() {
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('loadingText').textContent = 'Opening app...';

      // Check if online
      if (!navigator.onLine) {
        showError();
        return;
      }

      // Small delay to show splash then redirect
      setTimeout(() => {
        try {
          window.location.replace(GAS_URL);
        } catch(e) {
          showError();
        }
      }, 1200);
    }

    function showError() {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('loadingText').textContent = 'Connection failed';
      document.getElementById('errorBox').style.display = 'block';
    }

    // Listen for offline
    window.addEventListener('offline', showError);

    // Launch on load
    window.addEventListener('load', launchApp);
  </script>

</body>
</html>
